name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The same Nim and packages as the server's builder image (layonara-infra nwsync-builder/Dockerfile, #59).
      - name: Build layonara_nwn
        run: nimble install -y --requires:"neverwinter == 2.3.2; glob == 0.11.3; docopt == 0.7.1; checksums == 0.2.2; db_connector == 0.1.0; taskpools == 0.2.3; regex == 0.27.0; unicodedb == 0.14.1; unittest2 == 0.3.0"

      - name: Package binary
        run: |
          mkdir -p dist
          cp ~/.nimble/bin/layonara_nwn dist/
          cd dist
          tar czf ../layonara_nwn-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: layonara_nwn-linux-x64
          path: layonara_nwn-linux-x64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: layonara_nwn-linux-x64.tar.gz
          generate_release_notes: true
