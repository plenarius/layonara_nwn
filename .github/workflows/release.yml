name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'

      - name: Build layonara_nwn
        run: nimble install -y

      - name: Package binary
        run: |
          mkdir -p dist
          cp ~/.nimble/bin/layonara_nwn dist/
          cd dist
          tar czf ../layonara_nwn-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: layonara_nwn-linux-x64
          path: layonara_nwn-linux-x64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: layonara_nwn-linux-x64.tar.gz
          generate_release_notes: true
